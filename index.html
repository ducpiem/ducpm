    const audio = document.getElementById('main-audio');

    const disc = document.getElementById('music-disc');
    const trackNameEl = document.getElementById('track-name');
    const trackArtistEl = document.getElementById('track-artist');
    let isMusicStarted = false;
    
    // Hàm nạp bài hát hiện tại lên trình phát
    function loadTrack(index) {
      const track = playlist[index];
      audio.src = track.src;
      trackNameEl.textContent = track.name;
      trackArtistEl.textContent = track.artist;
    }

    function playMusic() {
      if (isMusicStarted) return;
      audio.volume = 0.40;
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        disc.classList.add('playing');
        isMusicStarted = true;
        removeInteractionListeners();
      }).catch(err => { console.log("Chờ người dùng tương tác để tự phát album..."); });
    }
    
    function togglePlay(e) {
      if(e) e.stopPropagation(); 
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
          isMusicStarted = true;
        });
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        disc.classList.remove('playing');
      }
    }

    function nextTrack(e) {
      if(e) e.stopPropagation();
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        disc.classList.add('playing');
        isMusicStarted = true;
      });
    }

    function prevTrack(e) {
      if(e) e.stopPropagation();
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        disc.classList.add('playing');
        isMusicStarted = true;
      });
    }

    /* ĐĂNG KÝ SỰ KIỆN ĐIỀU KHIỂN */
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    
    // TỰ ĐỘNG CHUYỂN BÀI KHI BÀI CŨ KẾT THÚC (AUTO NEXT ALBUM)
    audio.addEventListener('ended', () => {
      nextTrack(null);
    });
    
    function addInteractionListeners() {
      window.addEventListener('click', playMusic, { passive: true });
      window.addEventListener('touchstart', playMusic, { passive: true });
      window.addEventListener('scroll', playMusic, { passive: true });
    }
    
    function removeInteractionListeners() {
      window.removeEventListener('click', playMusic);
      window.removeEventListener('touchstart', playMusic);
      window.removeEventListener('scroll', playMusic);
    }
    
    window.addEventListener('DOMContentLoaded', () => {
      loadTrack(currentTrackIndex); // Nạp bài đầu tiên
      addInteractionListeners();
      playMusic();
      
      /* --- CHẠY ĐỒNG HỒ & BỘ ĐẾM KHI TRANG TẢI XONG --- */
      updateClock();
      setInterval(updateClock, 1000);
      updateCounter();
    });

    /* --- LOGIC ĐỒNG HỒ --- */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    /* --- LOGIC BỘ ĐẾM TRUY CẬP LOCALSTORAGE --- */
    function updateCounter() {
      let visits = localStorage.getItem('page_view_count');
      if (visits === null) {
        visits = 1;
      } else {
        visits = parseInt(visits) + 1;
      }
      localStorage.setItem('page_view_count', visits);
      document.getElementById('visit-counter').textContent = visits;
    }

    /* --- CANVAS: HIỆU ỨNG TUYẾT RƠI & BỤI SAO CHỔI --- */
    const canvas = document.getElementById('bg-particles');
    const ctx = canvas.getContext('2d');
    
    let particlesArray = [];      
    let cometDustArray = [];      
    const numberOfParticles = 45; 
    
    function setCanvasSize() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
    }
    setCanvasSize();
    window.addEventListener('resize', setCanvasSize);
    
    /* Lớp đối tượng Tuyết nền */
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 1.0; 
        this.speedX = Math.random() * 0.3 - 0.15;
        this.speedY = Math.random() * 0.5 + 0.2; 
        this.opacity = Math.random() * 0.35 + 0.25;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y > canvas.height) { 
          this.y = -10; 
          this.x = Math.random() * canvas.width;
        }
        if (this.x > canvas.width || this.x < 0) { this.speedX = -this.speedX; }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    /* Lớp đối tượng Bụi sao chổi đuôi chuột */
    class CometDust {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 2.0 + 0.5; 
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.speedY = Math.random() * 0.4 + 0.3; 
        this.opacity = 0.55; 
        this.fadeSpeed = Math.random() * 0.012 + 0.012; 
        this.colorType = Math.random();
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.opacity -= this.fadeSpeed;
      }
      draw() {
        let color = `rgba(255, 255, 255, ${this.opacity})`;
        if (this.colorType < 0.4) {
          color = `rgba(0, 242, 254, ${this.opacity})`; 
        } else if (this.colorType < 0.7) {
          color = `rgba(254, 9, 121, ${this.opacity})`; 
        }
        
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function init() { 
      for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); } 
    }
    
    window.addEventListener('mousemove', (e) => {
      for (let i = 0; i < 3; i++) {
        cometDustArray.push(new CometDust(e.clientX, e.clientY));
      }
    });
    
    window.addEventListener('touchmove', (e) => {
      if(e.touches.length > 0) {
        for (let i = 0; i < 3; i++) {
          cometDustArray.push(new CometDust(e.touches[0].clientX, e.touches[0].clientY));
        }
      }
    }, { passive: true });
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < particlesArray.length; i++) { 
        particlesArray[i].update(); 
        particlesArray[i].draw(); 
      }
      
      for (let i = 0; i < cometDustArray.length; i++) {
        cometDustArray[i].update();
        cometDustArray[i].draw();
        if (cometDustArray[i].opacity <= 0) {
          cometDustArray.splice(i, 1);
          i--;
        }
      }
      requestAnimationFrame(animate);
    }
    
    init(); 
    animate();
  </script>
</body>
</html>
