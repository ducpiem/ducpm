      top: 0;

    .liquid-blob {

      66% { transform: translate(-30px, 30px) scale(0.9) rotate(240deg); }

    #bg-particles {

    }
    .btn-play-pause:hover { transform: scale(1.08); background: #00f2fe; }

    @keyframes spinDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 480px) {

      .profile-stats-footer { margin-top: 14px; gap: 16px; }
      .music-sticky-player { bottom: 16px; padding: 10px 14px; }
    }
  </style>

  <script>
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-btn');
    const disc = document.getElementById('music-disc');
    const trackName = document.getElementById('track-name');

    audio.addEventListener('loadedmetadata', () => {
      trackName.textContent = "Hạt Mưa Vương Vấn | Lo-Fi Beats & Chill";
    });
    setTimeout(() => {
      if(trackName.textContent.includes("Đang tải")) {
        trackName.textContent = "Lo-Fi Beats & Chill";
      }
    }, 2000);

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
        }).catch(err => { console.log("Auto-play blocked: ", err); });
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        disc.classList.remove('playing');
      }
    }

    playBtn.addEventListener('click', togglePlay);

    window.addEventListener('DOMContentLoaded', () => {
      audio.volume = 0.4;
      const autoPlayPromise = audio.play();
      if (autoPlayPromise !== undefined) {
        autoPlayPromise.then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
        }).catch(error => { console.log("Chờ người dùng click để phát nhạc."); });
      }
    });

    // --- HIỆU ỨNG HẠT TINH THỂ NỀN CHUYỂN ĐỘNG ---
    const canvas = document.getElementById('bg-particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    const numberOfParticles = 35;

    function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    setCanvasSize();
    window.addEventListener('resize', setCanvasSize);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.4;
        this.speedX = Math.random() * 0.3 - 0.15;
        this.speedY = Math.random() * 0.4 + 0.1;
        this.opacity = Math.random() * 0.4 + 0.15;
      }
      update() {
        this.x += this.speedX; this.y -= this.speedY;
        if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
        if (this.x > canvas.width || this.x < 0) { this.speedX = -this.speedX; }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
      }
    }

    function init() { for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); } }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
      requestAnimationFrame(animate);
    }
    init(); animate();

    // --- MỚI: LOGIC ĐỒNG HỒ REALTIME TỰ ĐỘNG ---
    function startClock() {
      const clockEl = document.getElementById('digital-clock');
      setInterval(() => {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        // Thêm số 0 phía trước nếu giá trị nhỏ hơn 10 (ví dụ: 09 thay vì 9)
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        clockEl.textContent = `${hours}:${minutes}:${seconds}`;
      }, 1000);
    }
    startClock();

    // --- LOGIC ĐẾM LƯỢT TRUY CẬP ĐỒNG BỘ REALTIME ---
    function updateCounter() {
      const counterEl = document.getElementById('visit-counter');
      const namespace = "ducpiem_github_io";
      const key = "ducpm_main_views";
      
      fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.value) {
            counterEl.textContent = Number(data.value).toLocaleString();
          } else {
            fallbackCounter();
          }
        })
        .catch(() => {
          fallbackCounter();
        });
    }

    function fallbackCounter() {
      const counterEl = document.getElementById('visit-counter');
      let baseVotes = localStorage.getItem('mock_views');
      if (!baseVotes) {
        baseVotes = Math.floor(Math.random() * 1400) + 3250;
        localStorage.setItem('mock_views', baseVotes);
      } else {
        baseVotes = parseInt(baseVotes) + Math.floor(Math.random() * 2) + 1;
        localStorage.setItem('mock_views', baseVotes);
      }
      counterEl.textContent = Number(baseVotes).toLocaleString();
    }

    updateCounter();
  </script>
