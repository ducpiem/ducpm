    /* --- HIỆU ỨNG LIQUID NỀN CHUYỂN ĐỘNG (TÔNG TỐI) --- */
    .liquid-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;

    .liquid-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: screen;
      opacity: 0.24;
      animation: floatFluid 25s infinite alternate ease-in-out;
    }

    .blob-1 { width: 450px; height: 450px; background: radial-gradient(circle, #4f46e5 0%, rgba(0,0,0,0) 70%); top: -10%; left: -10%; animation-duration: 20s; }

    @keyframes floatFluid {
      0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      33% { transform: translate(40px, -60px) scale(1.1) rotate(120deg); }
      66% { transform: translate(-30px, 30px) scale(0.9) rotate(240deg); }
      100% { transform: translate(0px, 0px) scale(1) rotate(360deg); }

    .disc-container {

    .disc-container.playing { animation-play-state: running; }
    .disc-container i { color: #ffffff; font-size: 1.1rem; }
    .track-details { display: flex; flex-direction: column; overflow: hidden; }
    .track-title { font-size: 0.9rem; font-weight: 600; color: #ffffff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

    .btn-play-pause {

      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease;
    }
    .btn-play-pause:hover { transform: scale(1.08); background: #00f2fe; }

    @keyframes spinDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 480px) {

      .music-sticky-player { bottom: 16px; padding: 10px 14px; }
    }
  </style>

<body>

  <div class="music-sticky-player">
    <div class="music-info-side">
      <div class="disc-container" id="music-disc"><i class="fa-solid fa-music"></i></div>
      <div class="track-details">

        <span class="track-artist">Chill Music</span>
      </div>
    </div>
    <div class="music-controls-side">
      <button class="btn-play-pause" id="play-btn" title="Play/Pause"><i class="fa-solid fa-play"></i></button>
    </div>
    <audio id="main-audio" src="https://stream.nixcdn.com/resa/2601/bd/c8/gtmqjhy2qb.flac?st=ekk41tPq3cusS5Fv-8aQ1g&e=1779319064&download=true" loop></audio>
  </div>

  <script>
    /* --- LOGIC PHÁT NHẠC --- */
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-btn');
    const disc = document.getElementById('music-disc');

    let isMusicStarted = false;

    function playMusic() {
      if (isMusicStarted) return;
      audio.volume = 0.22;
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        disc.classList.add('playing');
        isMusicStarted = true;
        removeInteractionListeners();
      }).catch(err => { console.log("Chờ tương tác..."); });
    }

    function togglePlay(e) {
      if(e) e.stopPropagation(); 
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
          isMusicStarted = true;
        });
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        disc.classList.remove('playing');
      }
    }

    playBtn.addEventListener('click', togglePlay);

    function addInteractionListeners() {
      window.addEventListener('click', playMusic, { passive: true });
      window.addEventListener('touchstart', playMusic, { passive: true });
      window.addEventListener('scroll', playMusic, { passive: true });
    }

    function removeInteractionListeners() {
      window.removeEventListener('click', playMusic);
      window.removeEventListener('touchstart', playMusic);
      window.removeEventListener('scroll', playMusic);
    }

    window.addEventListener('DOMContentLoaded', () => {
      addInteractionListeners();
      playMusic();
    });

    /* --- ĐÃ CẬP NHẬT: HIỆU ỨNG TUYẾT RƠI LOÃNG VÀ NHẸ NHÀNG --- */
    const canvas = document.getElementById('bg-particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    
    // ĐÃ GIẢM: Hạ số lượng xuống 45 hạt để tạo độ loãng, thanh thoát, không rối mắt
    const numberOfParticles = 45; 

    function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    setCanvasSize();
    window.addEventListener('resize', setCanvasSize);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        // Kích thước vừa phải (từ 1.0px đến 3.2px) tự nhiên
        this.size = Math.random() * 2.2 + 1.0; 
        this.speedX = Math.random() * 0.3 - 0.15;
        this.speedY = Math.random() * 0.5 + 0.2; // Tốc độ rơi chậm rãi thư thái
        // Độ mờ hạt nhẹ nhàng ẩn hiện trên nền tối cực đẹp
        this.opacity = Math.random() * 0.35 + 0.25;
      }
      update() {
        this.x += this.speedX; 
        this.y += this.speedY; 
        if (this.y > canvas.height) { 
          this.y = -10; 
          this.x = Math.random() * canvas.width; 
        }
        if (this.x > canvas.width || this.x < 0) { this.speedX = -this.speedX; }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; 
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
        ctx.fill();
      }
    }

    function init() { for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); } }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
      requestAnimationFrame(animate);
    }
    init(); animate();
  </script>
</body>
