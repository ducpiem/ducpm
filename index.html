      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .liquid-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: screen;
      opacity: 0.25;
      animation: floatFluid 25s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #617efc 0%, rgba(0,0,0,0) 70%);
      top: -10%;
      left: -10%;
      animation-duration: 20s;

    .blob-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #d80073 0%, rgba(0,0,0,0) 70%);
      bottom: -15%;
      right: -10%;
      animation-duration: 28s;

    .blob-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #00f2fe 0%, rgba(0,0,0,0) 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 24s;
    }

    @keyframes floatFluid {
      0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      33% { transform: translate(40px, -60px) scale(1.1) rotate(120deg); }
      66% { transform: translate(-30px, 30px) scale(0.9) rotate(240deg); }
      100% { transform: translate(0px, 0px) scale(1) rotate(360deg); }
    }

    #bg-particles {

  <script>
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-btn');
    const disc = document.getElementById('music-disc');
    const trackName = document.getElementById('track-name');

    audio.addEventListener('loadedmetadata', () => {
      trackName.textContent = "Lo-Fi Beats & Chill";
    });
    setTimeout(() => {
      if(trackName.textContent.includes("Đang tải")) {
        trackName.textContent = "Lo-Fi Beats & Chill";
      }
    }, 2000);

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
        }).catch(err => { console.log("Auto-play blocked: ", err); });
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        disc.classList.remove('playing');
      }
    }

    playBtn.addEventListener('click', togglePlay);

    window.addEventListener('DOMContentLoaded', () => {
      audio.volume = 0.4;
      const autoPlayPromise = audio.play();
      if (autoPlayPromise !== undefined) {
        autoPlayPromise.then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
        }).catch(error => { console.log("Chờ người dùng click để phát nhạc."); });
      }
    });

    // --- HIỆU ỨNG HẠT TINH THỂ NỀN CHUYỂN ĐỘNG ---
    const canvas = document.getElementById('bg-particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    const numberOfParticles = 35;

    function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    setCanvasSize();
    window.addEventListener('resize', setCanvasSize);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.4;
        this.speedX = Math.random() * 0.3 - 0.15;
        this.speedY = Math.random() * 0.4 + 0.1;
        this.opacity = Math.random() * 0.4 + 0.15;
      }
      update() {
        this.x += this.speedX; this.y -= this.speedY;
        if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
        if (this.x > canvas.width || this.x < 0) { this.speedX = -this.speedX; }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
      }
    }

    function init() { for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); } }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
      requestAnimationFrame(animate);
    }
    init(); animate();
  </script>
