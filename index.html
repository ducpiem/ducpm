    body {

    /* --- HIỆU ỨNG LIQUID GLASS NỀN CHUYỂN ĐỘNG (DẠNG SÁNG) --- */
    .liquid-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .liquid-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      mix-blend-mode: multiply; /* Hòa trộn kiểu sáng */
      opacity: 0.22;
      animation: floatFluid 25s infinite alternate ease-in-out;
    }

    .blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, #4f46e5 0%, rgba(255,255,255,0) 70%); top: -10%; left: -10%; animation-duration: 20s; }
    .blob-2 { width: 550px; height: 550px; background: radial-gradient(circle, #ec4899 0%, rgba(255,255,255,0) 70%); bottom: -15%; right: -10%; animation-duration: 28s; }
    .blob-3 { width: 400px; height: 400px; background: radial-gradient(circle, #06b6d4 0%, rgba(255,255,255,0) 70%); top: 35%; left: 45%; transform: translate(-50%, -50%); animation-duration: 24s; }

    @keyframes floatFluid {
      0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      33% { transform: translate(50px, -50px) scale(1.15) rotate(120deg); }
      66% { transform: translate(-40px, 40px) scale(0.9) rotate(240deg); }
      100% { transform: translate(0px, 0px) scale(1) rotate(360deg); }
    }

    /* Hiệu ứng hạt tuyết phủ tràn lên thực đơn */
    #bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* --- ĐÃ CẬP NHẬT: KHUNG MENU TRONG SUỐT SIÊU ĐẸP (GLASSMORPHISM LIGHT) --- */

      background: rgba(255, 255, 255, 0.28); /* Độ trong suốt rất cao, thấy rõ nền phía sau */
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.5); /* Viền sáng như pha lê */
      border-radius: 32px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 
        0 20px 50px rgba(31, 45, 65, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);

    .avatar-container {

    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    
    .profile-name {

    /* --- TRÌNH PHÁT NHẠC FIXED BOTTOM (DẠNG SÁNG TRONG SUỐT) --- */
    .music-sticky-player {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 460px;
      background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 24px; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 35px rgba(31, 45, 65, 0.06);
      z-index: 1000;
    }

    .music-info-side { display: flex; align-items: center; gap: 12px; flex-grow: 1; overflow: hidden; }
    .disc-container {
      width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(45deg, #6366f1, #06b6d4);
      display: flex; align-items: center; justify-content: center; animation: spinDisc 4s linear infinite; animation-play-state: paused;
    }
    .disc-container.playing { animation-play-state: running; }
    .disc-container i { color: #ffffff; font-size: 1.1rem; }
    .track-details { display: flex; flex-direction: column; overflow: hidden; }
    .track-title { font-size: 0.9rem; font-weight: 600; color: #0f172a; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .track-artist { font-size: 0.75rem; color: #64748b; }

    .btn-play-pause {

      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease;
    }
    .btn-play-pause:hover { transform: scale(1.08); background: #6366f1; }

    @keyframes spinDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 480px) {

      .text-block { padding-right: 44px; }
      .title-main { font-size: 0.95rem; }
      .music-sticky-player { bottom: 16px; padding: 10px 14px; }
    }
  </style>

<body>

  <div class="music-sticky-player">
    <div class="music-info-side">
      <div class="disc-container" id="music-disc"><i class="fa-solid fa-music"></i></div>
      <div class="track-details">
        <span class="track-title" id="track-name">Lo-Fi Beats & Chill</span>
        <span class="track-artist">Chill Music</span>
      </div>
    </div>
    <div class="music-controls-side">
      <button class="btn-play-pause" id="play-btn" title="Play/Pause"><i class="fa-solid fa-play"></i></button>
    </div>

  </div>

  <script>
    /* --- LOGIC PHÁT NHẠC TỰ ĐỘNG KHI CHẠM MÀN HÌNH --- */
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-btn');
    const disc = document.getElementById('music-disc');

    let isMusicStarted = false;

    function playMusic() {
      if (isMusicStarted) return;
      audio.volume = 0.3;
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        disc.classList.add('playing');
        isMusicStarted = true;
        removeInteractionListeners();
      }).catch(err => { console.log("Chờ người dùng tương tác..."); });
    }

    function togglePlay(e) {
      if(e) e.stopPropagation(); 
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          disc.classList.add('playing');
          isMusicStarted = true;
        });
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        disc.classList.remove('playing');
      }
    }

    playBtn.addEventListener('click', togglePlay);

    function addInteractionListeners() {
      window.addEventListener('click', playMusic, { passive: true });
      window.addEventListener('touchstart', playMusic, { passive: true });
      window.addEventListener('scroll', playMusic, { passive: true });
    }

    function removeInteractionListeners() {
      window.removeEventListener('click', playMusic);
      window.removeEventListener('touchstart', playMusic);
      window.removeEventListener('scroll', playMusic);
    }

    window.addEventListener('DOMContentLoaded', () => {
      addInteractionListeners();
      playMusic();
    });

    /* --- HIỆU ỨNG TUYẾT RƠI DÀY PHỦ TRÊN MẶT KÍNH MENU --- */
    const canvas = document.getElementById('bg-particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    const numberOfParticles = 110; 

    function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    setCanvasSize();
    window.addEventListener('resize', setCanvasSize);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3.0 + 1.2; 
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * 0.6 + 0.3;
        // Đổi màu hạt tuyết xám trắng nhẹ để nổi bật trên cả nền sáng
        this.opacity = Math.random() * 0.4 + 0.45;
      }
      update() {
        this.x += this.speedX; 
        this.y += this.speedY; 
        if (this.y > canvas.height) { 
          this.y = -10; 
          this.x = Math.random() * canvas.width; 
        }
        if (this.x > canvas.width || this.x < 0) { this.speedX = -this.speedX; }
      }
      draw() {
        ctx.fillStyle = `rgba(220, 230, 242, ${this.opacity})`; /* Màu hạt trắng xanh tuyết */
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
        ctx.fill();
      }
    }

    function init() { for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); } }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
      requestAnimationFrame(animate);
    }
    init(); animate();
  </script>
